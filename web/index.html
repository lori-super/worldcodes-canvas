<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="referrer" content="no-referrer" />
        <meta name="description" content="WorldCodes Canvas 多模态创作工作台" />
        <script>
            try {
                var params = new URLSearchParams(window.location.search);
                var changed = false;
                Array.from(params.keys()).forEach(function (key) {
                    if (["apikey", "baseurl"].includes(key.toLowerCase())) {
                        params.delete(key);
                        changed = true;
                    }
                });
                if (changed) window.history.replaceState(null, "", window.location.pathname + (params.size ? "?" + params : "") + window.location.hash);
            } catch (e) {}
        </script>
        <link rel="icon" href="/logo.svg" />
        <title>WorldCodes Canvas</title>
        <script>
            try {
                var s = JSON.parse(localStorage.getItem("infinite-canvas:theme_store") || "{}");
                var t = s.state && s.state.theme === "light" ? "light" : "dark";
                document.documentElement.classList.toggle("dark", t === "dark");
                document.documentElement.style.colorScheme = t;
            } catch (e) {}
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script src="/config.js"></script>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
